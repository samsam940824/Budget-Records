name: Supabase Keepalive

on:
  schedule:
    # 09:40 Asia/Taipei every day. GitHub cron uses UTC.
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Write Supabase keepalive heartbeat
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "Missing VITE_SUPABASE_URL repository secret."
            exit 1
          fi

          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi

          # An anon read is blocked by RLS and does NOT reset the free-tier
          # auto-pause timer. A real write with the service_role key (which
          # bypasses RLS) registers as genuine database activity.
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          response_code="$(curl --silent --show-error --output /tmp/supabase_keepalive_response.txt --write-out "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/keepalive" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: resolution=merge-duplicates" \
            --data "{\"id\":1,\"last_ping\":\"$now\"}")"

          if [[ "$response_code" -lt 200 || "$response_code" -ge 300 ]]; then
            echo "Supabase keepalive failed with HTTP $response_code."
            cat /tmp/supabase_keepalive_response.txt
            exit 1
          fi

          echo "Supabase keepalive OK (HTTP $response_code, last_ping=$now)."
